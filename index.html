<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="/style.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
		<script defer src="/katex.js"></script>
	</head>
	<body>
		<canvas id="background"></canvas>
		<main id="screens">
			<div class="calculator">
				<p id="screen" class="screen"></p>
				<div id="buttons" class="buttons">
					<button data-input="1">1</button>
					<button data-input="+">+</button>
					<button data-special="submit">=</button>
					<button data-special="clear">AC</button>
				</div>
			</div>
			<div class="thatOtherthing"></div>
		</main>

		<button class="left">←</button>
		<button class="right">→</button>

		<div class="loading-overlay hidden" id="loading-overlay">
			<img src="./calculator.jpg">
			<div class="corner">
				<p>Saving...</p>
				<div class="loader"></div>
			</div>
		</div>

		<script src="/screens.js" type="module"></script>
		<script src="/script.js" type="module"></script>
	</body>
</html>
