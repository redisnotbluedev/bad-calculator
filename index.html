<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="/style.css">
		<!-- This is because we need the fonts which are already hosted on jsDelivr -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
	</head>
	<body>
		<output id="toast"></output>
		<canvas id="background"></canvas>
		<main id="screens">
			<div class="calculator" id="calculator">
				<p id="screen" class="screen"></p>
				<div id="buttons" class="buttons"></div>
			</div>
			<div class="shop" id="shop"></div>
			<div class="lucky-wheel" id="lucky-wheel">
				<div>
					<span>Spins: <b id="spin-counter">0</b></span>
					<div class="pointer"></div>
					<div id="wheel" class="wheel"></div>
					<div>
						<button id="spin">Spin</button>
						<button id="buy-spins">Get More</button>
					</div>
				</div>
				<ol class="logs" id="logs"></ol>
			</div>
			<div class="achievements" id="achievements"></div>
		</main>

		<button class="left">←</button>
		<button class="right">→</button>
		<span class="scene" id="scene">Calculator</span>

		<div class="loading-overlay hidden" id="loading-overlay">
			<img src="./calculator.jpg">
			<div class="corner">
				<p>Saving...</p>
				<div class="loader"></div>
			</div>
		</div>

		<script src="/main.js" type="module"></script>
	</body>
</html>
